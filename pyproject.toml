[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basil_package"
version = "0.1.0"
description = "Utilities and datasets for Gammapy analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gammapy",
]

[tool.setuptools.packages.find]
where = ["src"]

